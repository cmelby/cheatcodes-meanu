<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Codes Peptides | Bulk Menu</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <img src="assets/logo.png" alt="Cheat Codes Peptides" class="logo-img">
            <p class="subtitle">PREMIUM BULK PEPTIDES</p>
        </div>
    </header>

    <main class="container">
        <div class="sticky-bar">
            <div class="sticky-top">
                <input type="text" id="searchInput" placeholder="Search peptides..." class="search-input">
                <div class="order-summary">
                    <div class="totals-group">
                        <span class="summary-label">Total Order:</span>
                        <span class="summary-total" id="orderTotal">$0.00</span>
                    </div>
                    <button class="checkout-btn" id="checkoutBtn" disabled>Checkout</button>
                </div>
            </div>
            <div class="cart-items-preview" id="cartPreview"></div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading Live Pricing...</p>
        </div>

        <div id="productGrid" class="product-grid">
            <!-- Dynamic cards will be injected here -->
        </div>
    </main>

    <!-- Checkout Modal -->
    <div class="modal-overlay hidden" id="checkoutModal">
        <div class="modal-content">
            <h2 class="modal-title">Billing & Shipping Details</h2>
            <div class="form-group">
                <input type="text" id="custName" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" id="custEmail" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="text" id="custCompany" placeholder="Company Name (Optional)">
            </div>
            <div class="form-group">
                <textarea id="custAddress" placeholder="Full Shipping Address" rows="3" required></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="cancelCheckoutBtn">Cancel</button>
                <button class="btn-primary" id="generateInvoiceBtn">Generate Invoice</button>
            </div>
        </div>
    </div>

    <!-- Invoice Modal -->
    <div class="modal-overlay hidden" id="invoiceModal">
        <div class="modal-content invoice-wrapper">
            <div class="invoice-scroll-area" id="invoiceHTML">
                <!-- Dynamically populated -->
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="closeInvoiceBtn">Back to Menu</button>
                <button class="btn-primary" id="confirmOrderBtn">Confirm & Send Order</button>
            </div>
            <p id="invoiceStatus" class="invoice-status"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
